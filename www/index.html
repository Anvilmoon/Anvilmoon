<style>
@font-face{font-family:'Jacquarda Bastarda 9';font-weight:400;font-display:swap;src:url(fonts/jacquarda-bastarda-9-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:400;font-display:swap;src:url(fonts/pixelify-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:500;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:600;font-display:swap;src:url(fonts/pixelify-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:700;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
/* Palette from the oxide colours steel shows as it is tempered: straw, bronze, peacock, blue — on forge-iron greys. */
:root{
  --iron:#292624;--plate:#33302c;--plate2:#3c3833;--rule:#4b453e;--rule2:#5b544b;
  --ash:#ede5d8;--mute:#ab9f90;--dim:#837869;
  --straw:#e2c275;--bronze:#b9773f;--peacock:#8f6cc0;--blue:#5b8cc6;--verd:#8fbf7a;--red:#e0654f;
  --display:'Jacquarda Bastarda 9',Georgia,serif;--body:'Pixelify Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse 70% 55% at 0% 100%,rgba(185,119,63,.16),transparent 70%),radial-gradient(ellipse 50% 40% at 100% 0%,rgba(91,140,198,.06),transparent 70%),var(--iron);background-attachment:fixed;color:var(--ash);font:400 16px/1.5 var(--body);font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
.app{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:10px 24px 10px 22px;border-bottom:1px solid var(--rule);background:rgba(41,38,36,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.mark{font:700 34px/1 var(--display);color:var(--straw);letter-spacing:.01em;margin:0}
#hud{display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:1}
.who{color:var(--mute);font-size:15px}.who b{color:var(--ash);font-weight:700}
.stocks{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.stock{display:inline-flex;align-items:baseline;gap:5px;font-size:15px;white-space:nowrap}
.stock b{font-weight:800}.stock .lbl{color:var(--dim);font-size:13px}.stock .tick{color:var(--dim);font-size:12px;margin-left:2px}
.ingot{display:inline-block;width:12px;height:8px;background:var(--c);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);transform:translateY(-1px)}
/* rail */
nav.rail{grid-row:2;align-self:start;border-right:1px solid var(--rule);padding:14px 0;display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;height:calc(100vh - 57px);background:rgba(0,0,0,.08)}
#tabs{display:flex;flex-direction:column;gap:2px}
.railbtn{background:none;border:0;border-left:3px solid transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;cursor:pointer;font-size:13px;font-weight:500}
.railbtn:hover{color:var(--ash)}
.railbtn.on{color:var(--straw);border-left-color:var(--straw);background:linear-gradient(90deg,rgba(226,194,117,.09),transparent)}
.railbtn em{font-style:normal;color:var(--dim);font-size:12px}
#opts{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 6px;font-size:12px;color:var(--dim);text-align:center}
#opts label{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
main{grid-row:2;padding:28px 34px 110px;min-width:0}
.page{max-width:1180px;margin:0 auto}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin-bottom:22px}
.pagehead h1{font:700 52px/1 var(--display);margin:0;color:var(--ash);flex:0 0 100%}
.pagehead p{margin:0;color:var(--mute);max-width:68ch;flex:1}
h2{font:700 28px/1.1 var(--display);margin:0 0 12px}
h2.sect{font-size:30px;margin:30px 0 12px;color:var(--mute)}
h3{font:700 17px/1.25 var(--body);margin:0 0 8px}
p{margin:6px 0}
.fine{color:var(--mute);font-size:14px}
.mute{color:var(--mute)}
.warn{color:var(--red);font-size:14px}
/* plates: forged-steel panels, flat, with a lit top edge */
.plate{background:var(--plate);border-radius:3px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.3)}
.plate+.plate{margin-top:16px}
.platehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
/* buttons */
.btn{background:var(--plate2);border:1px solid var(--rule2);border-radius:4px;padding:8px 15px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ash);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--straw)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--straw);border-color:#f0d690;color:#2a2018}
.btn.go:hover{background:#ecd08a}
.btn.ghost{background:transparent}
.btn.small{padding:5px 11px;font-size:14px}
.btn.big{padding:13px 24px;font-size:17px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn[data-armed]{border-color:var(--red);color:#ffbcb0;background:rgba(224,101,79,.12)}
kbd{font:700 12px var(--body);border:1px solid currentColor;border-bottom-width:2px;border-radius:3px;padding:0 5px;opacity:.6;margin-left:6px}
/* ledger tables */
table.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger td,.ledger th{padding:6px 4px;border-bottom:1px solid var(--rule)}
.ledger tr:last-child td{border-bottom:0}
.ledger th{text-align:left;color:var(--dim);font-weight:500;font-size:13px}
.ledger .n{text-align:right;white-space:nowrap}
.ledger.tight td{padding:3px 2px;font-size:14px}
.ledger tr.me td{background:rgba(226,194,117,.07)}
.ledger tr.cur td{background:rgba(226,194,117,.14)}
.rank{color:var(--dim);width:28px}
.rar{color:var(--rc);font-weight:700}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:10px;margin:0 4px 2px 0;border:1px solid currentColor;line-height:1.5}
.tag.star{color:#bfeeff;border-color:transparent;background:linear-gradient(90deg,rgba(158,240,255,.25),rgba(227,168,255,.25),rgba(255,227,154,.25))}
.tag.temp{color:#a9c4ec;border-color:transparent;background:linear-gradient(90deg,rgba(226,194,117,.22),rgba(143,108,192,.22),rgba(91,140,198,.25))}
.tag.size{color:var(--straw)}.tag.runt{color:#e9a6c2}.tag.rec{color:#2a2018;background:var(--straw);border-color:var(--straw)}.tag.var{color:#cdb8f0}.tag.crack{color:var(--red)}
svg.blade{width:100%;height:auto;display:block;overflow:visible}
.pxblade{display:block;width:100%}.pxblade img{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.pxruler{display:block;position:relative;color:var(--mute);font-size:12px;line-height:1;margin-top:4px;white-space:nowrap}.pxruler i{display:block;height:6px;border:2px solid currentColor;border-top:0;margin-bottom:3px;opacity:.7}.pxpend{display:block}

.ruler line{stroke:var(--dim);stroke-width:1.6}.ruler text{fill:var(--dim);font:500 12px var(--body)}
/* forge */
.bprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.wtabs{margin-bottom:12px}
.bp{background:var(--plate);border:1px solid transparent;border-radius:3px;padding:14px 14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bp:hover{border-color:var(--rule2)}
.bp.on{border-color:var(--straw);background:linear-gradient(180deg,rgba(226,194,117,.08),transparent 60%),var(--plate)}
.bpart{display:block;min-height:46px;display:flex;align-items:center;margin-bottom:6px}
.bpn{font:700 22px/1.1 var(--display)}
.bpm{color:var(--mute);font-size:13.5px}
.forgegrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;align-items:start}
.forgegrid .plate+.plate{margin-top:0}
.commit h2{font-size:40px}
.recipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.recipe div{border-top:1px solid var(--rule);padding-top:6px}
.recipe dt{color:var(--dim);font-size:13px}.recipe dd{margin:0;font-size:24px;font-weight:800}
.commit .btn.big{width:100%}
.gearline{color:var(--mute);font-size:14px;margin-top:14px}.gearline b{color:var(--ash)}
/* forging stage */
.hearth{position:relative;border-radius:3px;padding:30px 30px 0;background:radial-gradient(ellipse 60% 70% at 50% 75%,var(--glow,transparent),transparent 75%),#1e1b19;box-shadow:inset 0 0 0 1px var(--rule),inset 0 -30px 60px rgba(0,0,0,.4);overflow:hidden}
.hearthblade{position:relative;z-index:1;max-width:760px;margin:0 auto -34px}
.anvilsvg{display:block;width:100%;max-width:760px;height:auto;margin:0 auto}
#sparks{position:absolute;inset:0;pointer-events:none;z-index:2}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd98a;box-shadow:0 0 6px #ffb44a;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.forgebar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:16px 0 6px;flex-wrap:wrap}
.pips{display:flex;gap:6px}
.pip{width:16px;height:16px;border-radius:2px;transform:rotate(45deg);border:1px solid var(--rule2);background:transparent}
.pip.p3{background:var(--straw);border-color:var(--straw)}.pip.p2{background:var(--bronze);border-color:var(--bronze)}.pip.p1{background:#7a4e33;border-color:#7a4e33}.pip.p0{background:#4a332a;border-color:#6a4538}
.msg{font-weight:700;font-size:17px;min-height:26px}
.strikebar{position:relative;height:28px;border-radius:2px;background:#1e1b19;box-shadow:inset 0 0 0 1px var(--rule);margin:8px 0 16px;overflow:hidden}
.strikebar .z1,.strikebar .z2{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.strikebar .z1{background:rgba(185,119,63,.25)}.strikebar .z2{background:rgba(226,194,117,.5)}
.strikebar .mk{position:absolute;top:3px;bottom:3px;width:4px;margin-left:-2px;background:var(--ash);box-shadow:0 0 10px #fff}
.controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#bellows{user-select:none;touch-action:none}
#bellows.on{border-color:var(--bronze);background:#4a3322}
.quench{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.qlead{flex:0 0 100%;text-align:center;color:var(--mute);margin:0 0 4px}
.qbtn{min-width:200px;text-align:left;display:flex;flex-direction:column;gap:2px}
.qbtn small{font-weight:400;color:var(--mute);font-size:14px}
.heatguide{margin-top:26px}
.heatguide .strip{height:8px;border-radius:1px;background:linear-gradient(90deg,#34302e 0%,#5c1a10 22%,#aa1e0e 40%,#ff640a 58%,#ffbe32 75%,#fff0c8 90%,#fffff5 100%)}
.heatguide .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:4px}
.hidden{display:none!important}

/* ===== pixel theme: square corners, chunky borders, stepped bevels ===== */
*,*::before,*::after{border-radius:0!important}
:root{--ink:#141110;--bev-hi:rgba(255,255,255,.09);--bev-lo:rgba(0,0,0,.32)}
body{font-size:16px;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--straw);outline-offset:0}
.mark,.pagehead h1,h2,.bpn,.rtitle,.banner,.steamtxt,.commit h2,h2.sect{font-weight:400!important;letter-spacing:0}
.pagehead h1{font-size:54px;line-height:1}h2.sect{font-size:36px}.banner{font-size:36px}
h2,.bpn,.rtitle,.commit h2,.hanginfo h3,.tool h3,.lotinfo h3,.duelist h3,.entry h3{font-family:var(--body)!important;font-weight:700!important;letter-spacing:0}h2{font-size:24px}h2.sect{font-family:var(--display)!important;font-weight:400!important}.bpn{font-size:20px}.hanginfo h3,.tool h3,.duelist h3{font-size:21px}.lotinfo h3,.entry h3{font-size:19px}.rtitle{font-size:36px}.commit h2{font-size:32px}
h3{font-weight:700}
header{border-bottom:3px solid var(--ink);backdrop-filter:none;background:#24211f}
nav.rail{border-right:3px solid var(--ink);background:#24211f}
.plate,.bp,.lot,.smith,.order,.acct,.reveal,.duel,.entry,.qrow,.hang,.toastbox,#toast>*{border:3px solid var(--ink)!important;box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo)!important}
.bp.on,.smith.cur,.entry.gold{border-color:var(--straw)!important}
.reveal.islegend{box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 3px #f0c35a,0 0 0 6px var(--ink)!important}
.reveal.isstar{box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 3px #9ef0ff,0 0 0 6px var(--ink)!important}
.reveal.istemp{box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 3px #8f6cc0,0 0 0 6px var(--ink)!important}
.reveal.ismoon{box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 3px #bcd4ff,0 0 0 6px var(--ink)!important}
.btn{border:3px solid var(--ink);box-shadow:inset 3px 3px 0 rgba(255,255,255,.12),inset -3px -3px 0 rgba(0,0,0,.3);transition:none;font-weight:600;letter-spacing:.02em}
.btn:hover{border-color:var(--ink);filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.3)}
.btn.go{border-color:var(--ink);box-shadow:inset 3px 3px 0 #fbe7a1,inset -3px -3px 0 #a8742c}
.btn.ghost{background:rgba(0,0,0,.18)}
.btn[data-armed]{border-color:var(--red)}
kbd{border-width:2px}
input,select,textarea{border:3px solid var(--ink)!important;background:#1c1917!important;box-shadow:inset 2px 2px 0 rgba(0,0,0,.35)!important}
.tag{border-width:2px;padding:0 6px;font-weight:600}
.ledger td,.ledger th{border-bottom-width:2px}
.ingot{display:none}
.mark{display:flex;align-items:center;gap:10px;font:700 30px/1 var(--body)!important;color:var(--straw);text-shadow:2px 2px 0 #7a4f1d,4px 4px 0 var(--ink);letter-spacing:.01em}
.emblem{width:58px;height:52px;image-rendering:pixelated;flex:none}
@media (max-width:760px){.emblem{width:29px;height:26px}.mark{font-size:22px!important;gap:6px;text-shadow:2px 2px 0 #7a4f1d,3px 3px 0 var(--ink)}}
.pxi{display:inline-block;width:24px;height:24px;background:center/24px 24px no-repeat;image-rendering:pixelated;align-self:center;flex:none}
.stock{align-items:center}
.pxico{display:block;width:36px;height:36px;background:center/36px 36px no-repeat;image-rendering:pixelated;filter:grayscale(.55) brightness(.8)}
.railbtn:hover .pxico{filter:none}
.railbtn.on .pxico{filter:none}
.railbtn.on{border-left-width:4px;background:rgba(226,194,117,.1)}
.railbtn{font-weight:600}

/* pixel forge scene */
.hearth.px{border-radius:0;background:radial-gradient(ellipse 60% 70% at 50% 75%,var(--glow,transparent),transparent 75%),var(--bricks) 0 0/96px 48px repeat,#1e1b19;image-rendering:pixelated;box-shadow:inset 0 0 0 3px #141110,inset 0 -40px 60px rgba(0,0,0,.45)}
.hearth.px .hearthblade{margin-bottom:-16px}
.pxcv,.pxanvil{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.pxanvil{max-width:760px;margin:0 auto;min-height:20px}
.hearth.px ~ .forgebar .pip{border-radius:0;transform:none;border-width:2px}
.hearth.px ~ .strikebar{border-radius:0;box-shadow:inset 0 0 0 3px #141110}
.hearth.px ~ .strikebar .mk{width:6px;margin-left:-3px;box-shadow:none;background:#fff8e6;top:4px;bottom:4px}
.hearth.px ~ .heatguide .strip{height:10px;border-radius:0;background:linear-gradient(90deg,#34302e 0 14%,#5c1a10 14% 28%,#aa1e0e 28% 42%,#ff640a 42% 58%,#ffbe32 58% 74%,#fff0c8 74% 90%,#fffff5 90%);box-shadow:0 0 0 2px #141110}
.hearth.px .spark{border-radius:0;width:6px;height:6px;box-shadow:none;background:#ffd98a;animation:spark .6s steps(6) forwards}
.hearth.px .spark:nth-child(3n){background:#ff9a3c;width:4px;height:4px}.hearth.px .spark:nth-child(4n){background:#fff1c4}

/* reveal */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 60%,rgba(60,40,25,.6),rgba(18,16,14,.96) 70%)}
.steamwrap{text-align:center}
.steam{position:relative;width:340px;height:220px;margin:0 auto}
.steam i{position:absolute;bottom:0;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(230,225,220,.5),rgba(230,225,220,0) 70%);animation:steam 1.4s ease-out infinite}
.steam i:nth-child(1){left:10px}.steam i:nth-child(2){left:110px;animation-delay:.25s}.steam i:nth-child(3){left:200px;animation-delay:.5s}.steam i:nth-child(4){left:60px;animation-delay:.7s}.steam i:nth-child(5){left:160px;animation-delay:.9s}
:root[style*='--puff'] .steam i{background:var(--puff) 0 0/100% 100% no-repeat;border-radius:0;height:90px;image-rendering:pixelated;animation-timing-function:steps(10)}
:root[style*='--puff'] .steam.starglow i{background:var(--puff) 0 0/100% 100% no-repeat;filter:sepia(1) hue-rotate(150deg) saturate(5) brightness(1.1)}
.steam.starglow i{background:radial-gradient(circle,rgba(170,235,255,.65),rgba(220,150,255,0) 70%)}
@keyframes steam{0%{transform:translateY(30px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-120px) scale(1.6);opacity:0}}
.steamtxt{font:500 30px var(--display);color:var(--mute)}
.reveal{width:min(860px,100%);text-align:center;position:relative;padding:26px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--plate);border-radius:3px;border-top:3px solid var(--rc);box-shadow:0 30px 80px rgba(0,0,0,.55);transition:border-color .5s,box-shadow .5s}
.reveal.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.reveal.islegend{box-shadow:0 0 0 1px rgba(240,195,90,.45),0 0 70px rgba(240,195,90,.22),0 30px 80px rgba(0,0,0,.55)}
.reveal.istemp{box-shadow:0 0 0 1px rgba(143,108,192,.5),0 0 60px rgba(91,140,198,.25),0 30px 80px rgba(0,0,0,.55)}
.reveal.isstar{box-shadow:0 0 0 1px rgba(158,240,255,.6),0 0 80px rgba(140,220,255,.3),0 0 160px rgba(210,140,255,.18),0 30px 80px rgba(0,0,0,.55)}
.banners{min-height:40px}
.banner{font:700 34px/1.1 var(--display);animation:pop .35s ease-out}
.banner.star{background:linear-gradient(90deg,#9ef0ff,#e3a8ff,#ffe39a,#9ef0ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.banner.temp{background:linear-gradient(90deg,#e2c275,#b9773f,#8f6cc0,#5b8cc6);-webkit-background-clip:text;background-clip:text;color:transparent}
.banner.size{color:var(--straw)}.banner.runt{color:#e9a6c2}.banner.crack{color:var(--red)}
.revealart{margin:10px 0 4px}
.measure{display:flex;justify-content:center;align-items:baseline;gap:6px}
.count{font:800 56px/1 var(--body);letter-spacing:-.01em}
.unit{font-size:22px;color:var(--mute)}
.sizecls{color:var(--mute);min-height:24px;font-size:16px}
.rtitle{font:700 40px/1.1 var(--display);color:var(--rc);margin:12px 0 4px;min-height:44px}
.rsub{color:var(--mute);min-height:24px;max-width:62ch;margin:0 auto}
.rsub .hl{color:var(--straw)}.rsub .hlv{color:#cdb8f0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px 14px;margin:10px 0 0}
.facts div{border-top:1px solid var(--rule);padding-top:4px}
.facts dt{color:var(--dim);font-size:12.5px}.facts dd{margin:0;font-weight:700}
.facts.big{grid-template-columns:repeat(4,1fr);margin:22px 0;text-align:left}.facts.big dd{font-size:22px;font-weight:800}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* levels & hard times */
.lvl{display:inline-flex;align-items:center;gap:6px;margin-left:12px;color:var(--straw);font-weight:700;font-size:14px}
.xpbar{display:inline-block;width:70px;height:5px;background:#1e1b19;box-shadow:inset 0 0 0 1px var(--rule)}.xpbar i{display:block;height:100%;background:var(--straw)}
.bp.lk{opacity:.6}.bp.lk .bpm{color:var(--bronze)}
.reqline{font-size:13.5px;color:var(--bronze);margin:6px 0 0}.reqline.met{color:var(--verd)}
.bogwarn{color:#c9a46a;font-size:14px}
.tag.bog{color:#a89a6a}.rsub .hlb{color:#c9a46a}
.hard{margin:-4px 0 20px;padding:18px 20px;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.12) 0 10px,transparent 10px 20px),#3a2a24;box-shadow:inset 0 0 0 1px #6a3f33}
.hardhead h2{color:#f0a48f;margin-bottom:4px}.hardhead p{color:#d9c3b8;max-width:72ch;margin:0 0 12px}
.hardgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.hardgrid h3{margin-bottom:2px}.hardgrid .btn{margin-top:8px}
.digging{color:var(--straw);font-weight:700;margin-top:10px}
@media (max-width:760px){.hardgrid{grid-template-columns:1fr}.qrow{grid-template-columns:1fr;grid-template-areas:"name" "ctl" "go"}.qgo{min-width:0;width:100%}.meal .btn{min-width:96px}}
/* rack */
.rack{display:flex;flex-direction:column;gap:2px}
.hang{display:grid;grid-template-columns:300px 1fr 250px;gap:22px;align-items:center;padding:16px 18px;background:var(--plate);border-left:3px solid var(--rc)}
.hang:first-child{border-top-right-radius:3px}.hang:last-child{border-bottom-right-radius:3px}
.hanginfo h3{font:700 23px/1.15 var(--display);color:var(--rc);margin-bottom:4px}
.hangact{display:flex;flex-direction:column;gap:8px;align-items:stretch}
/* workshop */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.tool{background:var(--plate);border-radius:3px;padding:16px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tool.cur{box-shadow:inset 0 0 0 1px var(--straw)}
.tool.far{opacity:.62}

.revealart.steaming .pxblade,.revealart.steaming svg{animation:emerge 1.3s steps(8) both}

@keyframes steamoff{0%{transform:translateY(10px) scale(1.3);opacity:1}100%{transform:translateY(-90px) scale(2);opacity:0}}
.revealart.popnow .pxblade,.revealart.popnow svg{animation:bladepop .45s steps(5)}

/* one font everywhere: VT323, a clear pixel font. size-adjust keeps the existing sizes in proportion */

// ---- commission board: a popup you can open from anywhere
// Rare blades are protected on the board: kept blades and keepsakes are never offered, and anything special

const precious=b=>{const w=[];if(isRecord(b))w.push('record');if(b.shine==='star')w.push('Starforged');if(b.shine==='temp')w.push('Tempered');if(b.moon)w.push('Moonlit');if(b.si>=5)w.push(SIZES[b.si].n);if(vr(b).rare)w.push('rare variant');if(b.rarity>=4)w.push('Legendary');return w};

const boardFit=()=>{const c=C();if(!c)return 0;const own=owned();return c.commissions.filter(q=>own.some(b=>deliverable(b,q)&&!precious(b).some(w=>w!=='record'))).length};

  const comms=c.commissions.map((q,qi)=>{const t=TYPES[q.type],foreign=!mine.includes(q.type),ok=own.filter(b=>deliverable(b,q)).sort((a,b)=>(precious(a).length?1:0)-(precious(b).length?1:0)||worth(a)-worth(b)),spare=ok.filter(b=>!precious(b).length);

    strike:(c,t,q=.5)=>{noise(c,t,.08,3200,1.2,.35);tone(c,520+q*380,t,.32,'square',.07);tone(c,1240+q*500,t,.22,'triangle',.06)},

// Saves are numbered (rev). base = the account save number this one grew from; pushed = the last rev the account has.
// Newest wins on its own. If two devices really did play at once, the saves are combined and no owned blade is dropped.
function mergeSaves(a,b){const[nw,old]=(b.at||0)>(a.at||0)?[b,a]:[a,b];const m=JSON.parse(JSON.stringify(nw));
  m.serial=Math.max(a.serial||0,b.serial||0);m.totalForged=Math.max(a.totalForged||0,b.totalForged||0);
  for(const k of['claimed','mailSeen'])m[k]={...(old[k]||{}),...(nw[k]||{})};
  const ids=new Set();(m.slots||[]).forEach(sm=>sm&&(sm.blades||[]).forEach(x=>ids.add(x.id)));
  const fp=x=>[x.type,x.len,x.grade,x.t||''].join('|');   // not the forger's name: that can be re-signed
  (old.slots||[]).forEach((os,i)=>{if(!os)return;const ms=m.slots.find(x=>x&&(x.cid===os.cid||(x.merged||[]).includes(os.cid)));
    if(!ms){const j=!m.slots[i]?i:m.slots.findIndex(x=>!x);if(j>=0)m.slots[j]=JSON.parse(JSON.stringify(os));return}
    const have=new Map((ms.blades||[]).map(x=>[fp(x),x]));
    (os.blades||[]).forEach(bl=>{const mine=have.get(fp(bl));
      // same blade in both saves: whichever changed last wins (sold, salvaged, delivered, listed or back on the rack)
      if(mine){if((bl.su||0)>(mine.su||0)||(!bl.su&&!mine.su&&mine.status==='owned'&&bl.status!=='owned')){const id=mine.id;Object.assign(mine,bl,{id})}return}
      if(bl.status!=='owned')return;const c={...bl};if(ids.has(c.id))c.id=++m.serial;ids.add(c.id);ms.blades.push(c)});

    <button class="btn go" data-action="arenaback">Back to the Arena</button></div></section>`}
  const rack=owned().filter(b=>!b.cracked).sort((a,b)=>worth(b)-worth(a));if(!ARENA.bladeId&&rack[0])ARENA.bladeId=String(rack[0].id);

      <button class="btn go big" data-action="arenago" ${ARENA.busy?'disabled':''}>Find an opponent</button>`
    :`<p class="empty">You need a blade on your rack to fight. Forge one first.</p>`}
   </div><div class="plate"><h2>Ladder</h2><p class="fine">You: rated ${NET.user.rating}, ${NET.user.wins} wins, ${NET.user.losses} losses.</p>
    <table class="ledger">${(ARENA.ladder||[]).map((u,i)=>`<tr class="${u.id===NET.user.id?'cur':''}"><td class="rank">${i+1}</td><td>${u.username}</td><td class="n">${u.rating}</td><td class="n mute">${u.wins}–${u.losses}</td></tr>`).join('')||'<tr><td class="fine">No ranked duels yet. Be the first.</td></tr>'}</table></div></div></section>`}

document.addEventListener('submit',async e=>{const f=e.target.closest('form.authform');if(!f)return;e.preventDefault();const v=n=>(f.elements.namedItem(n)||{}).value||'';
  if(f.dataset.auth==='password'){try{const r=await apiCall('/api/password',{method:'POST',body:{current:v('current'),next:v('next')}});if(r.user)NET.user=r.user;toast('Password saved.');render()}catch(x){toast(x.msg)}return}
  if(f.dataset.auth==='reset'){if(v('next')!==v('confirm')){NET.authErr='The two passwords don’t match.';render();return}
    try{const r=await apiCall('/api/password',{method:'POST',body:{access_token:NET.resetTok,next:v('next')}});if(r.user)NET.user=r.user;NET.resetTok=null;NET.authErr='';toast('New password saved.')}catch(x){NET.authErr=x.status===401?'That took too long. Start the reset again.':x.msg;if(x.status===401)NET.resetTok=null}render();return}

     <dl class="facts"><div><dt>Deposit now</dt><dd>${dep}c</dd></div><div><dt>If it sells at the start bid</dt><dd id="ahnet1">${fmt(Math.floor(st*(1-AH_CUT)))}c</dd></div><div><dt>At the buyout</dt><dd id="ahnet2">${bo?fmt(Math.floor(bo*(1-AH_CUT)))+'c':'No buyout'}</dd></div></dl>
     <button class="btn go big" data-action="ahcreate" ${c.coin>=dep?'':'disabled'}>Create auction</button><p class="fine">The deposit comes back if the blade sells. If it doesn’t sell, the blade comes back and the deposit is kept.</p>`
     :'<h2>Set your price</h2><p class="fine">Choose a blade from your rack to list it.</p>'}</div></div>`}
function ahMine(c){const me=ME_ID(),mine=AHL.filter(L=>L.seller===me),bids=AHL.filter(L=>L.bidder===me&&L.seller!==me);
  return `${ahStatusNote()}<h2 class="sect">Your auctions</h2>${mine.length?mine.map(L=>ahRow(L,c)).join(''):'<p class="empty">You have nothing listed. Use Sell to put a blade up.</p>'}
   <h2 class="sect">Your winning bids</h2>${bids.length?bids.map(L=>ahRow(L,c)).join(''):'<p class="empty">You aren’t the top bidder on anything. Outbid coin is returned by mail.</p>'}`}
document.addEventListener('input',e=>{if(e.target.id==='ahq'){ahUI.q=e.target.value;clearTimeout(window.__ahq);window.__ahq=setTimeout(()=>{const pos=e.target.selectionStart;ahDefer=false;const el=$('ahbody');if(el){el.innerHTML=ahBody();const q=$('ahq');if(q){q.focus();q.setSelectionRange(pos,pos)}}},250)}
  const f=e.target.dataset&&e.target.dataset.ahf;if(f){ahUI[f]=e.target.value;const a=$('ahnet1'),b2=$('ahnet2');if(a)a.textContent=fmt(Math.floor((+ahUI.start||0)*(1-AH_CUT)))+'c';if(b2)b2.textContent=+ahUI.buyout?fmt(Math.floor(+ahUI.buyout*(1-AH_CUT)))+'c':'No buyout'}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ah;if(k){ahUI[k]=k==='minR'?+e.target.value:e.target.value;ahDefer=false;$('ahbody').innerHTML=ahBody()}
  if(e.target.name==='dur'&&e.target.closest('.sellform')){ahUI.dur=e.target.value;ahDefer=false;$('ahbody').innerHTML=ahBody()}});

const ACT={
  authmode:el=>{NET.authPicked=true;NET.authMode=el.dataset.m;NET.authErr='';render()},
  signout:async()=>{await pushSave();try{await apiCall('/api/logout',{method:'POST'})}catch(e){}signedOut('Signed out. You can keep playing on this device.')},
  pwopen:()=>{const f=$('pwform');if(f)f.classList.toggle('hidden')},
  codeopen:()=>{const f=$('codeform');if(f)f.classList.toggle('hidden')},codeget:async()=>{try{const r=await apiCall('/api/recovery',{method:'POST',body:{}});NET.user=r.user;showCode(r.code);window.scrollTo(0,0)}catch(x){toast(x.msg)}render()},
  codelater:()=>{NET.codeLater=true;render()},
  codecopy:async()=>{try{await navigator.clipboard.writeText(NET.newCode);toast('Copied.')}catch(e){toast('Couldn’t copy. Select the code and copy it by hand.')}},codedone:()=>{showCode(null);render()},
  oauth:el=>oauthGo(el.dataset.p,el.dataset.m),forgot:()=>{NET.forgot=!NET.forgot;render()},oauthcancel:()=>{NET.oauth=null;NET.authErr='';render()},resetskip:()=>{NET.resetTok=null;NET.authErr='';render()},
  unlink:async el=>{try{const r=await apiCall('/api/unlink',{method:'POST',body:{id:el.dataset.id}});NET.user=r.user;toast('Unlinked.')}catch(x){toast(x.msg)}render()},
  keeplocal:async()=>{NET.conflict=null;await pushSave();toast('Kept this device’s save. Your account now has it too.');render()},
  keepremote:()=>{A=NET.conflict;NET.conflict=null;if(!DEV)A.testOdds=false;ENT=null;try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}toast('Your account’s save is loaded.');render()},
  arenago:()=>arenaQueue(),
  move:el=>arenaMove(el.dataset.m),
  leavequeue:async()=>{try{await apiCall('/api/pvp/leave',{method:'POST'})}catch(e){}ARENA.queued=null;render()},
  forfeit:async()=>{try{const r=await apiCall('/api/pvp/forfeit',{method:'POST'});arenaUpdate(r.match)}catch(e){toast(e.msg)}},
  arenaback:()=>{ARENA.match=null;render()},
  pickw:el=>{const c=C(),w=el.dataset.w;c.selW=w;const first=typesOf(c.cls).find(k=>TYPES[k].wt===w);if(TYPES[c.sel].wt!==w&&first)c.sel=first;save();render()},
  armcls:el=>{UI.armCls=el.dataset.k;render()},
  reccls:el=>{UI.recCls=el.dataset.k;render()},
  recpage:el=>{UI.recPage=el.dataset.k;render();document.querySelector('.rectabs .ahtab.on')?.scrollIntoView({block:'nearest',inline:'center'})},
  backup:async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(A))));try{await navigator.clipboard.writeText(code);toast('Backup code copied. Keep it somewhere safe.')}catch(e){const b=$('restorebox'),t=$('restoretxt');b.classList.remove('hidden');t.value=code;t.select();toast('Copy the code from the box below.')}},
  restoreopen:()=>{$('restorebox').classList.remove('hidden');$('restoretxt').focus()},
  restore:()=>{try{const s2=JSON.parse(decodeURIComponent(escape(atob($('restoretxt').value.trim()))));if(!s2||!s2.slots)throw 0;A=s2;save();toast('Save restored.');render()}catch(e){toast('That code didn’t work. Check that you copied all of it.')}},
  ahview:el=>{ahUI.view=el.dataset.v;render()},
  ahpick:el=>{ahUI.sellId=el.dataset.id;const b=blade(el.dataset.id);ahUI.start=String(Math.max(1,Math.round(worth(b)*.9)));ahUI.buyout=String(Math.round(worth(b)*1.4));$('ahbody').innerHTML=ahBody()},
  ahcreate:()=>ahCreate(),
  ahbid:el=>{const v=+($('bid-'+el.dataset.id)||{}).value;ahBid(el.dataset.id,v,false)},
  ahbuy:el=>{const L=AHL.find(x=>x.id===el.dataset.id);if(L)ahBid(L.id,L.buyout,true)},
  ahcancel:el=>ahCancel(el.dataset.id),
  eat:el=>{const kk=el.dataset.k;setTimeout(()=>{const b=document.querySelector(`[data-action=eat][data-k="${kk}"]`);if(b)floatUp(b,'+5%')},0);const c=C(),k=el.dataset.k,m=MEALS[k],p=mealPrice(c,k);if(c.coin<p||c.fuel+m.e>ENERGY_CAP)return;c.coin-=p;c.fuel+=m.e;const d=today();if(!c.meals||c.meals.d!==d)c.meals={d,n:0};c.meals.n++;save();toast(`You eat the ${m.n.toLowerCase()}. +${m.e} energy.`);render()},
  learn:el=>{const c=C(),k=el.dataset.k,r=RECIPES[k];if(knows(c,k)||!reqMet(c,r)||!canPay(r.cost))return;pay(r.cost);c.recipes=c.recipes||{};c.recipes[k]=true;
    const nc=c.commissions.length;save();toast(`Learned: ${c.cls==='arcane'&&ARC.Q[k]?ARC.Q[k]+' binding':r.n}.`);render()},
  labor:()=>{const c=C();if(!isBroke(c))return toast('The foreman only hires smiths who are broke.');if(laborLeft(c)<=0)return toast('No more shifts today. Come back tomorrow.');startForge(true)},
  handover:()=>handOver(),
  dig:()=>{const c=C();if(!isBroke(c))return;c.digUntil=Date.now()+(A.testOdds?8000:DIG_MS);save();render()},
  collectdig:()=>{const c=C();if(!c.digUntil||Date.now()<c.digUntil)return;c.digUntil=0;c.bog=(c.bog||0)+1;c.coal+=1;gainXP(c,3);save();toast('You haul out 1 bog iron and 1 coal.');render()},
  tab:el=>{if(F)return toast('Finish the blade first.');A.tab=el.dataset.tab;save();render()},
  pick:el=>{C().sel=el.dataset.type;save();render()},
  supopen:()=>{UI.sup=true;render()},supclose:()=>{UI.sup=false;render()},
  rackopen:el=>{RACK.open=el.dataset.k;render()},rackclose:()=>{RACK.open=null;render()},
  racktoggle:()=>{UI.rack=!UI.rack;RACK.open=null;RACK.man={};render()},bulksell:el=>bulkDo(el.dataset.k,'sell'),bulksalv:el=>bulkDo(el.dataset.k,'salv'),bfreset:()=>{RACK.f={...BF0};RACK.man={};render()},keeptoggle:el=>{const b=blade(el.dataset.id);if(!b)return;b.keep=!b.keep;if(RACK.man)delete RACK.man[b.id];save();toast(b.keep?'Kept. Bulk selling will skip it.':'Unlocked.');render()},bulkall:el=>{const st=rackStacks().find(x=>x.k===el.dataset.k);if(!st)return;const{ok}=bulkState(st.list);st.list.forEach(b=>{if(ok(b))RACK.man[b.id]=true});render()},bulknone:el=>{const st=rackStacks().find(x=>x.k===el.dataset.k);if(!st)return;st.list.forEach(b=>RACK.man[b.id]=false);render()},
  begin:()=>startForge(),
  quick:()=>quickForge(),
  tdq:el=>tourQuench(el.dataset.q),rackmore:()=>{RACK.more=!RACK.more;render()},rackclear:()=>{Object.assign(RACK,{minR:0,minS:0,q:'',wt:'',fx:'',minL:''});render()},tutdone:()=>{A.tutDone=1;UI.tut=false;save();render()},tutopen:()=>tourStart(),boardtoggle:()=>{UI.board=!UI.board;if(UI.board){UI.mail=false;UI.rack=false;RACK.open=null}render()},tournext:()=>{if(TOUR.i>=TOUR_STEPS.length-1)tourEnd();else tourStep(1)},tourback:()=>tourStep(-1),tourend:()=>tourEnd(),
  snd:()=>{SFX.toggle();if(!SFX.muted)SFX.play('click');renderHUD()},
  quench:el=>startQuench(el.dataset.q),
  mailopen:()=>{UI.mail=true;UI.rack=false;renderDrawer();renderMailbox();renderBoard();fetchMail()},mailclose:()=>{UI.mail=false;renderMailbox()},
  mailget:el=>{const m=MAIL.list.find(x=>x.id===el.dataset.id);const got=collectOne(m);renderMailbox();renderHUD();
    if(got&&isGift(got)){UI.mail=false;renderMailbox();showReveal(got)}else{if(m&&m.blade&&got)toast(`${bname(got)} is on your rack.`);render()}},
  mailall:()=>{let gift=null;[...MAIL.list].forEach(m=>{const g=collectOne(m);if(g&&isGift(g))gift=g});renderHUD();if(gift){UI.mail=false;renderMailbox();showReveal(gift)}else{toast('All mail collected.');render();renderMailbox()}},
  giftkeep:()=>{SFX.play('coin');closeReveal();UI.rack=true;render()},
  keep:el=>{const b=blade(el.dataset.id);(b.status='owned',b.su=Date.now());save();toast(`${bname(b)} added to your rack.`);closeReveal()},
  sell:el=>{sellBlade(blade(el.dataset.id));save();revealId?closeReveal():render()},
  salvage:el=>{salvBlade(blade(el.dataset.id));save();revealId?closeReveal():render()},
  salvplain:()=>{const c=C(),list=owned().filter(b=>b.rarity===0&&!b.shine&&b.si>0&&b.si<4&&!vr(b).rare&&!isRecord(b)&&!b.keep),tot={};list.forEach(b=>{const y=salvYield(b);for(const[k,v]of Object.entries(y)){const add=k==='fuel'?Math.max(0,Math.min(ENERGY_CAP,c[k]+v)-c[k]):v;c[k]+=add;tot[k]=(tot[k]||0)+add}(b.status='salvaged',b.su=Date.now())});save();toast(`Salvaged ${list.length} blades into ${yieldStr(tot)}.`);render()},
  qstep:el=>{const row=el.closest('.qrow'),cur=+row.querySelector('input').value||1,d=el.dataset.d;qSync(row,d==='max'?+row.dataset.max:cur+ +d)},
  qgo:el=>{const row=el.closest('.qrow'),c=C(),op=row.dataset.op,m=row.dataset.m,n=qSync(row,+row.querySelector('input').value);
    if(op==='buy'){const cost=PRICES[m]*n;if(c.coin<cost)return toast('Not enough coin.');c.coin-=cost;c[m]+=n;toast(`Bought ${n} ${MATN[m].toLowerCase()} for ${fmt(cost)}c.`)}
    else if(op==='sell'){if(c[m]<n)return;c[m]-=n;c.coin+=SELLMAT[m]*n;toast(`Sold ${n} ${MATN[m].toLowerCase()} for ${fmt(SELLMAT[m]*n)}c.`)}
    else{if(c.dust<n*10)return;c.dust-=n*10;c.shards+=n;toast(`Refined ${n*10} star-dust into ${n} star-shard${n>1?'s':''}.`)}
    QTY[row.dataset.key]=n;save();render()},
  fulfill:el=>{const c=C(),i=c.commissions.findIndex(q=>q.id===el.dataset.cid);if(i<0)return;const q=c.commissions[i],sel=$('sel-'+q.id),b=sel&&blade(sel.value);if(!b||!deliverable(b,q))return;
    c.coin+=q.pay;gainXP(c,10+Math.min(q.pay,300)/4);(b.status='commission',b.su=Date.now());c.commissions[i]=genComm(c);save();toast(`${q.patron} paid <b>${q.pay}c</b>.`);render()},
  refresh:()=>{const c=C();if(c.coin<10)return;c.coin-=10;c.commissions=[genComm(c),genComm(c),genComm(c)];save();render()},
  anvil:()=>{const c=C(),a=ANVILS[c.anvil+1];if(!a||!canPay(a.cost))return;pay(a.cost);c.anvil++;save();toast(`${a.n} crafted. Your rarity odds improved.`);render()},
  hammer:el=>{const c=C(),k=el.dataset.h,h=HAMMERS[k];if(!canPay(h.cost))return;pay(h.cost);c.hammers[k]={dur:h.dur};c.hammer=k;save();toast(`${h.n} crafted and equipped.`);render()},
  equip:el=>{C().hammer=el.dataset.h;save();render()},
  repair:el=>{const c=C(),k=el.dataset.h,h=HAMMERS[k];if(!canPay(h.repair))return;pay(h.repair);c.hammers[k].dur=h.dur;save();toast(`${h.n} repaired.`);render()},
  clsswitch:el=>switchClass(el.dataset.k),clslearn:el=>learnClass(el.dataset.k),
  odds:el=>{A.testOdds=el.checked;save();render()},
  reset:()=>{F=null;try{localStorage.removeItem(KEY)}catch(e){}A=freshAcct();save();closeReveal();toast('Everything has been deleted. Fresh start.')},
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.board){UI.board=false;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.tagName==='LABEL')return;
  if(el.type==='checkbox'){ACT[el.dataset.action]?.(el);return}
  if(el.dataset.confirm&&!el.dataset.armed){el.dataset.armed='1';el.dataset.orig=el.innerHTML;el.style.width=el.offsetWidth+'px';el.textContent='Sure?';el.title='Click again to confirm';setTimeout(()=>{if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.innerHTML=el.dataset.orig;el.style.width=''}},2500);return}
  ACT[el.dataset.action]?.(el)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-slot]');if(!f)return;e.preventDefault();const i=+f.dataset.slot;if(i!==0||A.slots.some(Boolean))return;
  const name=NET.user?NET.user.username:pick(NAMES)+' '+pick(['Ashford','Coldwater','Emberly','Harth','Steelwick','Vane']),cls='war';
  const c=newChar(name,cls);c.classes=[cls];c.selBy={};A.slots[i]=c;ensure(c);A.active=i;A.tab='forge';save();toast(`${name} the ${CLASSES[cls].n} lights the forge.`);render()});
document.addEventListener('keydown',e=>{if(!F||F.done)return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)strike()}if(e.code==='KeyF'){F.bell=true;$('bellows')?.classList.add('on')}});
document.addEventListener('keyup',e=>{if(e.code==='KeyF'&&F){F.bell=false;$('bellows')?.classList.remove('on')}});

try{const AppP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(AppP)AppP.addListener('backButton',()=>{if(F||revealId)return;if(A.tab!=='forge'&&C()){A.tab='forge';save();render()}else AppP.minimizeApp()})}catch(e){}
try{const native=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform();if(!native&&'serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
let prevOpen=slotsOpen();
setInterval(()=>{A.slots.forEach(c=>{if(c)TK.forEach(k=>c.demand[k]+=(1-c.demand[k])*.03)});save();const o=slotsOpen();if(o>prevOpen){prevOpen=o;const cc=C();if(cc&&cc.classes.length<CK.length&&o>clsN(cc))toast('You can learn a new class now. Tap your name to see it.',4000)}},5000);
setInterval(()=>{const c=C();if(!c)return;const k=pick(typesOf(c.cls));c.demand[k]=Math.min(1.6,c.demand[k]+.4);save();if(!F&&!revealId)toast(`Merchants are clamoring for <b>${TYPES[k].n}s</b>.`)},75000);
setInterval(()=>{renderHUD();const c=C();if(!c)return;const el=$('digleft');if(el){const s=Math.ceil((c.digUntil-Date.now())/1000);if(s>0)el.textContent=s;else if(!F&&!revealId&&A.tab==='forge')render()}},1000);
if(A.active<0)A.tab='chars';setTimeout(netInit,0);
render();
